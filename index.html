<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Hello, world!</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; color: #f8fafc; background: radial-gradient(ellipse at 50% 0%, #263b5b 0, #101827 58%); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { text-align: center; }
    p { margin: 0 0 1rem; color: #a8bad2; font-size: .8rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3rem, 12vw, 7rem); letter-spacing: -.065em; line-height: 1; }
    h1 span { color: #8ec5ff; }
  </style>
</head>
<body>
  <main>
    <p>My first website</p>
    <h1>Hello, <span>world!</span></h1>
  </main>
</body>
</html>
